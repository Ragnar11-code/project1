<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoltPath – EV Charging</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="auth-container">
  <div class="brand">
    <div class="logo">⚡</div>
    <h1>VoltPath</h1>
    <p>India's Smart EV Charging Network</p>
  </div>

  <!-- LOGIN FORM -->
  <div class="card" id="login-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your account</p>
    <div id="login-error" class="error-msg" style="display:none"></div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="login-email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Enter your password">
    </div>
    <button class="btn-primary" onclick="handleLogin()">Sign In</button>
    <p class="switch-text">Don't have an account? <a href="pages/register.html">Create one</a></p>
    <p class="admin-hint">Admin? Use Admin@gmail.com / Admin123</p>
  </div>
</div>
<script src="js/auth.js"></script>
</body>
</html>
